[project]
name = "mirdo-server"
version = "0.1.0"
description = "Local companion dialogue server for the Godot FPS project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "pydantic-ai>=2.8.0",
    "pydantic-graph>=2.8.0",]

[dependency-groups]
dev = [
    "pytest>=8.0.0",    "ruff>=0.8.0",
]
